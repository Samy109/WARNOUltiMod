name: PR Age Alert

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  alert-stale-test-pr:
    name: Alert on Test PR older than 3 days
    runs-on: ubuntu-latest

    steps:
      - name: Create one alert issue for stale Test PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const assignee = "Samy109";
            const now = Date.now();
            const maxAgeMs = 3 * 24 * 60 * 60 * 1000;
            const markerPrefix = "<!-- pr-age-alert:";

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "master",
              head: `${owner}:Test`,
              per_page: 100
            });

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "workflow-alert",
              per_page: 100
            });

            for (const pr of prs) {
              const ageMs = now - new Date(pr.created_at).getTime();
              if (ageMs < maxAgeMs) {
                continue;
              }

              const marker = `${markerPrefix}${pr.number} -->`;
              const alreadyOpen = issues.some((issue) => issue.body && issue.body.includes(marker));
              if (alreadyOpen) {
                core.info(`Alert already exists for PR #${pr.number}.`);
                continue;
              }

              await github.rest.issues.create({
                owner,
                repo,
                title: `Open Test PR needs attention: #${pr.number}`,
                body: [
                  marker,
                  `The Test -> master PR #${pr.number} has been open for more than 3 days.`,
                  "",
                  `PR: ${pr.html_url}`,
                  "",
                  "Review it, approve it if it is ready, or close/update it if it should not merge."
                ].join("\n"),
                assignees: [assignee],
                labels: ["workflow-alert"]
              });

              core.info(`Created stale PR alert for PR #${pr.number}.`);
            }
