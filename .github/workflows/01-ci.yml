name: CI

on:
  push:
    branches: [Test]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    name: App build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build WARNO Mod Maker
        shell: cmd
        run: build.bat

  test-harness:
    name: Test harness sub-project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile test harness
        shell: bash
        run: |
          mkdir -p test-build
          find src/com src/test/java -name "*.java" > sources-ci.txt
          javac -d test-build --release 17 -cp "lib/flatlaf-3.6.jar:src" @sources-ci.txt

      - name: Run console E2E tests when fixtures are present
        shell: bash
        run: |
          if [ -d "tester files" ]; then
            java -Djava.awt.headless=true -cp "test-build:lib/flatlaf-3.6.jar" com.warnomodmaker.ComprehensiveE2ETest --console
          else
            echo "No 'tester files' fixture directory found; test harness compile completed."
          fi
