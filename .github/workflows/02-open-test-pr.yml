name: Open Test PR

on:
  push:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-test-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    name: Open Test to master PR
    runs-on: ubuntu-latest

    steps:
      - name: Create or reuse pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "Test";
            const base = "master";
            const headRef = `${owner}:${head}`;

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`
            });

            if (comparison.data.ahead_by === 0) {
              core.info(`${head} has no commits ahead of ${base}; no pull request needed.`);
              return;
            }

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base,
              head: headRef,
              per_page: 100
            });

            if (existing.length > 0) {
              core.info(`Pull request already exists: #${existing[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: "Merge Test into master",
              head,
              base,
              body: [
                "Automated pull request from `Test` into `master`.",
                "",
                "CI must pass and `Samy109` must approve before the merge gate will squash-merge this PR."
              ].join("\n")
            });

            core.info(`Created pull request #${pr.data.number}: ${pr.data.html_url}`);
